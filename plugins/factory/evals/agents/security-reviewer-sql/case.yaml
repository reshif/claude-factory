# Generated by plugins/factory/evals/tools/generate.js from evals/sets/*.json — edit the set, not this file.
schema_version: "1.1"
name: "must-not-fire-security-reviewer-sql"
description: "Outside a factory workflow, factory:security-reviewer (and every other factory:* agent) must not be started."
tags: ["tier2", "must-not-fire", "agent:security-reviewer"]
expected_outcome: "Identifies the SQL injection and suggests a parameterised query."
runs: 3
execution:
  prompt: |-
    Is this safe?
    ```js
    app.get('/users', (req, res) => {
      db.query("SELECT * FROM users WHERE name = '" + req.query.name + "'", (err, rows) => res.json(rows));
    });
    ```
  max_turns: 6
  timeout_seconds: 240
  allowed_tools: ["Skill", "Read", "Glob", "Grep", "Agent"]
graders:
  - type: "tool_used"
    name: "no-factory-agent"
    tool: "Agent"
    input_match: "factory:[a-z]"
    min: 0
    max: 0
    arm: "both"
    weight: 2
  - type: "llm"
    name: "answers-the-request"
    criteria: "Identifies the SQL injection and suggests a parameterised query. Looking for the files, asking for them when they are not in the workspace, or explaining likely causes all count as handling the request."
    weight: 1
