schema_version: "1.1"
name: "must-not-fire-code-reviewer-diff"
description: "Outside a factory workflow, factory:code-reviewer (and every other factory:* agent) must not be started."
tags: ["tier2", "must-not-fire", "agent:code-reviewer"]
expected_outcome: "Reviews the diff itself (or with a general-purpose helper) and points out that quantity is no longer multiplied in."
runs: 3
execution:
  prompt: |-
    Review this diff:
    ```diff
    --- a/src/cart.js
    +++ b/src/cart.js
    @@ -10,7 +10,7 @@ function cartTotal(items, discount) {
    -  const subtotal = items.reduce((s, i) => s + i.price * i.qty, 0);
    +  const subtotal = items.reduce((s, i) => s + i.price, 0);
       return subtotal - discount;
     }
    ```
  max_turns: 6
  timeout_seconds: 240
  allowed_tools: ["Skill", "Read", "Glob", "Grep", "Agent"]
graders:
  - type: "tool_used"
    name: "no-factory-agent"
    tool: "Agent"
    input_match: "factory:[a-z]"
    min: 0
    max: 0
    arm: "both"
    weight: 2
  - type: "llm"
    name: "answers-the-request"
    criteria: "Reviews the diff itself (or with a general-purpose helper) and points out that quantity is no longer multiplied in. Looking for the files, asking for them when they are not in the workspace, or explaining likely causes all count as handling the request."
    weight: 1
