# Generated by plugins/factory/evals/tools/generate.js from evals/sets/*.json — edit the set, not this file.
schema_version: "1.1"
name: "dispatch-park"
description: "A mocked `factory next` result must lead to factory:park."
tags: ["tier2", "dispatch", "skill:park"]
expected_outcome: "Explains the park and offers the exact replies resume / cancel job / abandon job."
runs: 3
execution:
  prompt: |-
    I'm in the middle of a Software Factory job (J-0004, recipe standard@medium). I just ran `factory next` and it printed:
    ```json
    {
      "action": "parked",
      "reason": "Review rounds used up (2) with confirmed serious findings still open.",
      "rule": "cap.review_rounds",
      "decision_id": "J-0004-D0019"
    }
    ```
    Carry on from here. (I can't run commands for you right now; tell me what happens next.)
  max_turns: 8
  timeout_seconds: 240
  allowed_tools: ["Skill", "Read", "Glob", "Grep"]
graders:
  - type: "tool_used"
    name: "loads-park"
    tool: "Skill"
    input_match: "factory:park(?![\\w-])"
    min: 1
    arm: "both"
    weight: 2
  - type: "regex"
    name: "outcome"
    target: "last_message"
    pattern: "\\bresume\\b[\\s\\S]*\\b(cancel job|abandon job)\\b|\\b(cancel job|abandon job)\\b[\\s\\S]*\\bresume\\b"
    flags: "i"
    weight: 1
