# Generated by plugins/factory/evals/tools/generate.js from evals/sets/*.json — edit the set, not this file.
schema_version: "1.1"
name: "dispatch-clarify-waits"
description: "A mocked `factory next` result must lead to factory:clarify."
tags: ["tier2", "dispatch", "skill:clarify"]
expected_outcome: "Shows the read-back screen as it is and stops for the user's ok or correction."
runs: 3
execution:
  prompt: |-
    I'm in the middle of a Software Factory job (J-0004, recipe standard@medium). I just ran `factory next` and it printed:
    ```json
    {
      "action": "skill",
      "skill": "clarify",
      "decision_id": "J-0004-D0003",
      "clarify": {
        "stage": "readback_wait",
        "run": null,
        "workflow": null,
        "waiting_for_user": true,
        "screen": "**Read-back · J-0004 Fix the cart total**\n\n**What you want** (my words; correct me)\n- Problem: shoppers with a discount code see the wrong cart total\n- Outcome: the cart total matches checkout\n\n**What I will find out**\n1. [repo] Where the cart total is computed\n\nReply **ok** to start research, or tell me in your own words what to change.",
        "reply_command": "factory clarify reply \"<the user's words>\"",
        "status_command": "factory clarify status --job J-0004"
      }
    }
    ```
    Carry on from here. (I can't run commands for you right now; tell me what happens next.)
  max_turns: 8
  timeout_seconds: 240
  allowed_tools: ["Skill", "Read", "Glob", "Grep"]
graders:
  - type: "tool_used"
    name: "loads-clarify"
    tool: "Skill"
    input_match: "factory:clarify(?![\\w-])"
    min: 1
    arm: "both"
    weight: 2
  - type: "regex"
    name: "outcome"
    target: "last_message"
    pattern: "\\bok\\b[\\s\\S]{ 0,200 }(change|correct)|Read-back"
    flags: "i"
    weight: 1
