# Generated by plugins/factory/evals/tools/generate.js from evals/sets/*.json — edit the set, not this file.
schema_version: "1.1"
name: "dispatch-intake"
description: "A mocked `factory next` result must lead to factory:intake."
tags: ["tier2", "dispatch", "skill:intake"]
expected_outcome: "Restates the intent and proposes a work type and risk for confirmation."
runs: 3
execution:
  prompt: "Use the factory for this: shoppers with a discount code see the wrong cart total. (I already ran `factory doctor`: the repo is initialised, and there is no active factory job.)"
  max_turns: 8
  timeout_seconds: 240
  allowed_tools: ["Skill", "Read", "Glob", "Grep"]
graders:
  - type: "tool_used"
    name: "loads-intake"
    tool: "Skill"
    input_match: "factory:intake(?![\\w-])"
    min: 1
    arm: "both"
    weight: 2
  - type: "regex"
    name: "outcome"
    target: "last_message"
    pattern: "\\b(bug|risk)\\b"
    flags: "i"
    weight: 1
