# Generated by plugins/factory/evals/tools/generate.js from evals/sets/*.json — edit the set, not this file.
schema_version: "1.1"
name: "dispatch-gate"
description: "A mocked `factory next` result must lead to factory:gate."
tags: ["tier2", "dispatch", "skill:gate"]
expected_outcome: "Ends by presenting gate H1 with the exact approve / deny replies."
runs: 3
execution:
  prompt: |-
    I'm in the middle of a Software Factory job (J-0004, recipe standard@medium). I just ran `factory next` and it printed:
    ```json
    {
      "action": "gate",
      "gate": {
        "id": "H1",
        "hash": "4be1c09f2a7d31e05c66b2a9",
        "docs": [
          ".factory/jobs/J-0004/contract.md"
        ]
      },
      "decision_id": "J-0004-D0007"
    }
    ```
    The contract says: Goal — discounted carts show the same total as checkout. AC-1: cart total equals checkout total for a 10% code (evidence: test). AC-2: totals are rounded to the cent once, after the discount (evidence: test). Allowed paths: src/cart/**, tests/cart/**. Verify: `npm test -- cart` (AC-1, AC-2).
    Carry on from here. (I can't run commands for you right now; tell me what happens next.)
  max_turns: 8
  timeout_seconds: 240
  allowed_tools: ["Skill", "Read", "Glob", "Grep"]
graders:
  - type: "tool_used"
    name: "loads-gate"
    tool: "Skill"
    input_match: "factory:gate(?![\\w-])"
    min: 1
    arm: "both"
    weight: 2
  - type: "regex"
    name: "outcome"
    target: "last_message"
    pattern: "H1[\\s\\S]{ 0,200 }(approve|deny)"
    flags: "i"
    weight: 1
