# Generated by plugins/factory/evals/tools/generate.js from evals/sets/*.json — edit the set, not this file.
schema_version: "1.1"
name: "dispatch-clarify"
description: "A mocked `factory next` result must lead to factory:clarify."
tags: ["tier2", "dispatch", "skill:clarify"]
expected_outcome: "Runs (or names) the clarify stage: factory wfargs clarify, then the clarify workflow, then factory record."
runs: 3
execution:
  prompt: |-
    I'm in the middle of a Software Factory job (J-0004, recipe standard@medium). I just ran `factory next` and it printed:
    ```json
    {
      "action": "skill",
      "skill": "clarify",
      "decision_id": "J-0004-D0002",
      "clarify": {
        "stage": "readback",
        "run": "factory wfargs clarify",
        "workflow": "clarify",
        "waiting_for_user": false,
        "status_command": "factory clarify status --job J-0004"
      }
    }
    ```
    Carry on from here. (I can't run commands for you right now; tell me what happens next.)
  max_turns: 8
  timeout_seconds: 240
  allowed_tools: ["Skill", "Read", "Glob", "Grep"]
graders:
  - type: "tool_used"
    name: "loads-clarify"
    tool: "Skill"
    input_match: "factory:clarify(?![\\w-])"
    min: 1
    arm: "both"
    weight: 2
  - type: "regex"
    name: "outcome"
    target: "last_message"
    pattern: "wfargs clarify|factory:clarify|read[- ]?back"
    flags: "i"
    weight: 1
