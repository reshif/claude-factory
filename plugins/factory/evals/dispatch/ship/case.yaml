# Generated by plugins/factory/evals/tools/generate.js from evals/sets/*.json — edit the set, not this file.
schema_version: "1.1"
name: "dispatch-ship"
description: "A mocked `factory next` result must lead to factory:ship."
tags: ["tier2", "dispatch", "skill:ship"]
expected_outcome: "Talks about the PR or the merge the user has to do."
runs: 3
execution:
  prompt: |-
    I'm in the middle of a Software Factory job (J-0004, recipe standard@medium). I just ran `factory next` and it printed:
    ```json
    {
      "action": "skill",
      "skill": "ship",
      "decision_id": "J-0004-D0024"
    }
    ```
    Carry on from here. (I can't run commands for you right now; tell me what happens next.)
  max_turns: 8
  timeout_seconds: 240
  allowed_tools: ["Skill", "Read", "Glob", "Grep"]
graders:
  - type: "tool_used"
    name: "loads-ship"
    tool: "Skill"
    input_match: "factory:ship(?![\\w-])"
    min: 1
    arm: "both"
    weight: 2
  - type: "regex"
    name: "outcome"
    target: "last_message"
    pattern: "\\b(PR|pull request|merge)\\b"
    flags: "i"
    weight: 1
