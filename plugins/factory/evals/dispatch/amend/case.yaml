# Generated by plugins/factory/evals/tools/generate.js from evals/sets/*.json — edit the set, not this file.
schema_version: "1.1"
name: "dispatch-amend"
description: "A mocked `factory next` result must lead to factory:amend."
tags: ["tier2", "dispatch", "skill:amend"]
expected_outcome: "Treats the drift as an amendment question for the user."
runs: 3
execution:
  prompt: |-
    I'm in the middle of a Software Factory job (J-0004, recipe standard@medium). I just ran `factory next` and it printed:
    ```json
    {
      "action": "skill",
      "skill": "amend",
      "reason": "contract.md changed after H1 was approved",
      "decision_id": "J-0004-D0011"
    }
    ```
    Carry on from here. (I can't run commands for you right now; tell me what happens next.)
  max_turns: 8
  timeout_seconds: 240
  allowed_tools: ["Skill", "Read", "Glob", "Grep"]
graders:
  - type: "tool_used"
    name: "loads-amend"
    tool: "Skill"
    input_match: "factory:amend(?![\\w-])"
    min: 1
    arm: "both"
    weight: 2
  - type: "regex"
    name: "outcome"
    target: "last_message"
    pattern: "amend|approved|intended"
    flags: "i"
    weight: 1
